name: Mobile checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
        env:
          EXPO_NO_TELEMETRY: '1'
      - run: npm test
      - run: npx expo export --platform web
        env:
          EXPO_NO_TELEMETRY: '1'
