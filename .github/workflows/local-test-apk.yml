name: Local test APK
on:
  push:
    branches: [master]
    paths: ['.github/workflows/local-test-apk.yml']
  workflow_dispatch:
    inputs:
      backend_url:
        description: Phone-reachable backend origin
        required: true
        default: 'http://172.18.67.184:8000'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EXPO_NO_TELEMETRY: '1'
      SURAKSHA_LOCAL_TEST_BUILD: 'true'
      EXPO_PUBLIC_API_URL: ${{ inputs.backend_url || 'http://172.18.67.184:8000' }}
      EXPO_PUBLIC_ENABLE_TEST_LOGIN: 'true'
      EXPO_PUBLIC_ALLOW_INSECURE_HTTP: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npx expo prebuild --platform android --no-install
      # Expo's generated local release uses its debug signing key. This is a
      # separate, clearly labelled test package, not a store-signed production app.
      # Release embeds JS so offline tests do not depend on a Metro server.
      - run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
        working-directory: android
      - run: |
          mkdir -p test-apk
          cp android/app/build/outputs/apk/release/app-release.apk test-apk/suraksha-local-test.apk
          sha256sum test-apk/suraksha-local-test.apk > test-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: suraksha-local-test-apk
          path: test-apk/
          retention-days: 14
          if-no-files-found: error
